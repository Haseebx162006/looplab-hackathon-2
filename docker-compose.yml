version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: skillforge-db
    restart: always
    environment:
      POSTGRES_DB: loop_hack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loop_hack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rag-service:
    build:
      context: ./RAG-Service
      dockerfile: Dockerfile
    container_name: skillforge-rag-service
    restart: always
    environment:
      PORT: 5002
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/loop_hack_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    ports:
      - "5002:5002"
    depends_on:
      db:
        condition: service_healthy

  agent-service:
    build:
      context: ./Agent-Service
      dockerfile: Dockerfile
    container_name: skillforge-agent-service
    restart: always
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      NODE_ENV: production
      GROQ_API_KEY: ${GROQ_API_KEY}
      RAG_SERVICE_URL: http://rag-service:5002
    ports:
      - "8000:8000"
    depends_on:
      - rag-service

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillforge-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: loop_hack_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/loop_hack_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey}
      JWT_EXPIRES_IN: 24h
      RAG_SERVICE_URL: http://rag-service:5002
      AGENT_SERVICE_URL: http://agent-service:8000
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      GMAIL_USER_EMAIL: ${GMAIL_USER_EMAIL}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillforge-frontend
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000 # Keep localhost as it runs in the user's browser client
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
